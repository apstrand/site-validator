[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "site-validator"
version = "0.1.0"
description = "Validate websites for broken links — works interactively and as a CI step"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.12",
    "rich>=13.0",
    "click>=8.1",
    "lxml>=5.0",
]

[project.scripts]
sv = "sitevalidator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sitevalidator"]

[tool.hatch.envs.default]
dependencies = ["pytest", "pytest-asyncio"]
